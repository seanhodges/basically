name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  checks:
    name: Checks (typecheck, lint, format, docs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run docs:build

  # The unit suite is the long pole of the gate - one runner spent about five
  # and a half of the seven minutes `checks` used to take - and it splits
  # cleanly, so it runs beside the static checks rather than after them.
  #
  # Three ways is deliberate. Vitest assigns files to shards by hashing the
  # file path, not by what they cost, and the cost here is nowhere near even:
  # the top twenty files are about 72% of the runtime and the remaining four
  # hundred are under 2%. So the split is only ever roughly balanced, and the
  # single slowest file is a floor no shard count can go below - past three
  # ways the shards mostly wait on that one file.
  test:
    name: Unit tests (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run --shard=${{ matrix.shard }}/3

  # Blocking, and affordable enough to be: the suite runs against the built
  # artifact rather than a dev server, which took it from about twelve minutes
  # to about three, so gating on it costs less than the staleness it used to be
  # allowed to accumulate. Failures upload the Playwright report as an artifact.
  #
  # `npm run e2e:chromium` builds the app and the docs into dist/ itself, as the
  # Playwright webServer command - there is no separate build step here.
  e2e:
    name: E2E (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  build:
    needs: [checks, test, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Build the app into dist/ first (vite empties dist/), then build the
      # docs into dist/docs/ so a single Pages artifact ships both.
      # VITE_SHARE_API_URL comes from the SHARE_API_URL repo variable (the
      # deployed basically-share-server stack's ShareApiUrl output). When the
      # variable is unset the value is empty and the share client degrades to
      # its 'unconfigured' path rather than firing requests at a bad origin.
      - run: npm run build
        env:
          VITE_SHARE_API_URL: ${{ vars.SHARE_API_URL }}
      - run: npm run docs:build
      # GitHub Pages has no SPA rewrites; serving a copy of index.html as the
      # 404 page lets cold deep links like /run/abc234 boot the app shell,
      # which routes them to the standalone player.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  notify:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Resolve release info
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } =
              await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
              });
            const pr = prs.find((p) => p.merged_at) || prs[0];

            const commit = context.payload.head_commit || {};
            let rawTitle, title, body, url;
            if (pr) {
              rawTitle = pr.title;
              title = `Deployed: ${pr.title} (#${pr.number})`;
              body = pr.body || '_No description provided._';
              url = pr.html_url;
            } else {
              // Fallback: direct push to main with no associated PR
              rawTitle = (commit.message || '').split('\n')[0];
              title = 'Deployed a change';
              body = commit.message || context.sha;
              url =
                commit.url ||
                `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}`;
            }

            // Only announce conventional-commit feat/fix changes to Discord.
            const shouldPublish = /^(feat|fix)(\(.+\))?!?:/i.test(
              rawTitle.trim(),
            );
            core.setOutput('shouldPublish', shouldPublish);
            if (!shouldPublish) return;

            body = body
              .split('\n')
              .filter((line) => !/^(Co-Authored-By|Claude-Session):/i.test(line.trim()))
              .join('\n')
              .replace(/^\s*\n+/, '')
              .replace(/\n+\s*$/, '');

            // Discord embed description hard limit is 4096 chars
            if (body.length > 4000) body = body.slice(0, 3990) + '\n… (truncated)';

            const payload = {
              embeds: [{ title, url, description: body, color: 0x2ecc71 }],
            };
            require('fs').writeFileSync(
              'discord-payload.json',
              JSON.stringify(payload),
            );

      - name: Post to Discord #releases
        if: steps.release.outputs.shouldPublish == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: >
          curl -sf -X POST -H "Content-Type: application/json"
          -d @discord-payload.json "$DISCORD_WEBHOOK_URL"
