name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  checks:
    name: Checks (typecheck, lint, format, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run docs:build

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Build the app into dist/ first (vite empties dist/), then build the
      # docs into dist/docs/ so a single Pages artifact ships both.
      - run: npm run build
      - run: npm run docs:build
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  notify:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Resolve release info
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } =
              await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
              });
            const pr = prs.find((p) => p.merged_at) || prs[0];

            const commit = context.payload.head_commit || {};
            let title, body, url;
            if (pr) {
              title = `Deployed: ${pr.title} (#${pr.number})`;
              body = pr.body || '_No description provided._';
              url = pr.html_url;
            } else {
              // Fallback: direct push to main with no associated PR
              title = 'Deployed a change';
              body = commit.message || context.sha;
              url =
                commit.url ||
                `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}`;
            }

            body = body
              .split('\n')
              .filter((line) => !/^(Co-Authored-By|Claude-Session):/i.test(line.trim()))
              .join('\n')
              .replace(/^\s*\n+/, '')
              .replace(/\n+\s*$/, '');

            // Discord embed description hard limit is 4096 chars
            if (body.length > 4000) body = body.slice(0, 3990) + '\n… (truncated)';

            const payload = {
              embeds: [{ title, url, description: body, color: 0x2ecc71 }],
            };
            require('fs').writeFileSync(
              'discord-payload.json',
              JSON.stringify(payload),
            );

      - name: Post to Discord #releases
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: >
          curl -sf -X POST -H "Content-Type: application/json"
          -d @discord-payload.json "$DISCORD_WEBHOOK_URL"
